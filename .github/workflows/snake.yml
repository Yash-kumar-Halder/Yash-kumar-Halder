name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snakes
        uses: Platane/snk@v3
        with:
          github_user_name: Yash-Kumar-Halder
          outputs: |
            dist/github-snake.svg?color_dots=#000000,#6a2e00,#9c3f00,#e65100,#ff5100&color_snake=#ffffff
            dist/github-snake-green.svg?color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_snake=#ffffff

      - name: Generate Pac-Man Animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Yash-Kumar-Halder

      - name: Move Pac-Man and fix permissions
        run: |
          sudo mkdir -p dist
          sudo mv pacman-contribution-graph.svg dist/ || echo "Pac-Man not generated, skipping move"
          sudo chmod -R 777 dist

      - name: Push Animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
